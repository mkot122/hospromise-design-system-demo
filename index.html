<!doctype html>
<html lang="pl" data-theme="hospromise">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>hp-ds — prototyp Design Systemu</title>
  <meta name="description" content="Interaktywny prototyp docelowego Design Systemu hospromise.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Przejdź do treści</a>
  <div id="app"></div>
  <div class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <dialog class="modal" id="demo-modal" aria-labelledby="modal-title">
    <form method="dialog" class="modal__surface">
      <div class="modal__header">
        <div>
          <span class="eyebrow">Potwierdzenie</span>
          <h2 id="modal-title">Zapisz zmiany?</h2>
        </div>
        <button class="icon-button" value="cancel" aria-label="Zamknij">×</button>
      </div>
      <p>To demonstracyjny modal hp-ds. W produkcie akcja zachowa kontekst strony i fokus użytkownika.</p>
      <div class="modal__actions">
        <button class="button button--tertiary" value="cancel">Anuluj</button>
        <button class="button button--primary" value="confirm">Zapisz zmiany</button>
      </div>
    </form>
  </dialog>
  <script src="app.js" defer></script>
</body>
</html>
